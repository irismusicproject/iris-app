name: Release

# One button to release what's finished on main to the live site.
#   1. database: apply main's new migrations to PRODUCTION (an owner approves
#      the "production" environment first);
#   2. website: move the `production` branch up to main, which makes Vercel
#      publish the new code at app.irismusicproject.org;
#   3. version: tag that exact code (e.g. v0.2) and publish a GitHub Release
#      page with notes listing the pull requests it contains.
# The database always goes first, so the live site never shows a screen
# whose tables don't exist yet. See README, "Releasing".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2 (prototype), v1.0 (first musicians), v1.0.1 (bug fix)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is the version new and well-formed?
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Use a version like v0.2 or v1.0.1"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then echo "::error::$VERSION already exists"; exit 1; fi
        env:
          VERSION: ${{ inputs.version }}

  database:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: database-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Migrations that will run on production
        run: supabase db push --dry-run --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply them (never the fake seed data)
        run: supabase db push --yes --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  website:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: What this release contains
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ${VERSION} released to app.irismusicproject.org"
            echo
            if git rev-parse --verify -q origin/production >/dev/null; then
              git log --oneline --no-merges origin/production..HEAD | sed 's/^/- /'
            else
              echo "- First release: everything on main"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Move the production branch up to main
        # Fast-forward only: if someone changed production directly, this
        # stops instead of overwriting their change.
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > moved-at.txt
          git push origin HEAD:refs/heads/production
      # Moving the branch only ASKS Vercel to publish. v0.8 (Nov 27, 2026)
      # reported success while Vercel's build had failed, so the live site
      # stayed on the old code. Wait for Vercel's own answer for this commit,
      # posted after the move (the commit's older status is staging's), and
      # fail the release if the live site didn't get it. The tag comes after.
      - name: Wait for Vercel to publish it on the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD); since=$(cat moved-at.txt)
          for i in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses" --jq "[.[] | select(.context == \"Vercel\" and .created_at >= \"$since\")][0].state // \"waiting\"")
            echo "Vercel: $state"
            case "$state" in
              success) echo "Live at app.irismusicproject.org."; exit 0 ;;
              failure|error) echo "::error::Vercel didn't publish this release; the live site still runs the previous code. See the Vercel dashboard (production deployments)."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::No answer from Vercel within 20 minutes; check the Vercel dashboard."; exit 1
      - name: Tag the version and publish release notes
        run: gh release create "$VERSION" --target "$(git rev-parse HEAD)" --title "$VERSION" --generate-notes
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
