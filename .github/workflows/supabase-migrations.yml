name: Database migrations

# Applies supabase/migrations to the real databases (prototyping setup, Ryan,
# Nov 2026). Pull requests never touch a database: prototype on a local
# Supabase (npm run dev:local) and CI tests in a throwaway one.
#   * staging: automatically, whenever main changes a migration (plus the fake
#     data in supabase/seed.sql);
#   * production: only when an owner runs "deploy-production" from the Actions
#     tab and approves the "production" environment.
# Each environment holds only its own database's connection string, so the
# staging job cannot reach production. See README, "Automated database changes".

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "plan = show pending migrations on both databases; build-staging = apply all migrations and fake data to staging; deploy-production = apply main's migrations to production; mark-applied = record already-applied migrations in production's history"
        type: choice
        options: [plan, build-staging, deploy-production, mark-applied]
        default: plan
      versions:
        description: "For mark-applied: migration versions separated by spaces, e.g. 20261121120000 20261122120000"
        type: string
        required: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  staging:
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.task != 'mark-applied')
    runs-on: ubuntu-latest
    environment: staging
    # One staging change at a time. A production job waiting for approval
    # never holds up staging: they're separate queues.
    concurrency:
      group: database-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Is this environment set up?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::The ${{ github.job }} environment has no DATABASE_URL secret yet (README, Automated database changes). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Migrations that will run on staging
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --dry-run --include-seed --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply migrations and fake seed data to staging
        if: steps.cfg.outputs.ok == 'true' && (github.event_name == 'push' || inputs.task == 'build-staging' || inputs.task == 'deploy-production')
        run: supabase db push --include-seed --yes --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  production:
    needs: staging
    # Only on request: never on push, never from build-staging.
    if: github.event_name == 'workflow_dispatch' && (inputs.task == 'plan' || inputs.task == 'deploy-production')
    runs-on: ubuntu-latest
    # The "production" environment requires an owner's approval before this
    # job starts, and is the only place production's connection string lives.
    environment: production
    concurrency:
      group: database-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Is this environment set up?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::The ${{ github.job }} environment has no DATABASE_URL secret yet (README, Automated database changes). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Migrations that will run on production
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --dry-run --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply migrations to production (never the seed)
        if: steps.cfg.outputs.ok == 'true' && inputs.task == 'deploy-production'
        run: supabase db push --yes --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  mark-applied:
    # One-time repair: production's first migrations were run by hand in the
    # SQL Editor, so the CLI's history table doesn't know about them yet.
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'mark-applied'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: database-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Is this environment set up?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::The ${{ github.job }} environment has no DATABASE_URL secret yet (README, Automated database changes). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Check the versions
        if: steps.cfg.outputs.ok == 'true'
        run: |
          [[ "$VERSIONS" =~ ^[0-9]{14}([[:space:]]+[0-9]{14})*$ ]] || { echo "Versions must be 14-digit migration numbers separated by spaces"; exit 1; }
          for v in $VERSIONS; do ls supabase/migrations/${v}_*.sql >/dev/null || exit 1; done
        env:
          VERSIONS: ${{ inputs.versions }}
      - name: Record them as applied
        if: steps.cfg.outputs.ok == 'true'
        run: supabase migration repair --status applied $VERSIONS --db-url "$DATABASE_URL"
        env:
          VERSIONS: ${{ inputs.versions }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Anything still pending?
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --dry-run --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
