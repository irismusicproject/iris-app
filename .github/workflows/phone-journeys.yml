name: Phone journeys (Android emulator, staging)

# Drives the real Android app with Maestro (mobile/.maestro/*.yaml), free on
# GitHub's machines instead of Expo's paid cloud (Ryan, Nov 24, 2026):
#  1. build the app from this commit, pointed at STAGING (fake data);
#  2. get staging ready (mobile/.maestro/prepare-staging.mjs, public key only);
#  3. start an Android emulator and run the flows; screenshots are uploaded.
# The website side of the same promises is in e2e/ (docs/ACCEPTANCE.md).
#
# Runs on pull requests that change the phone app, and on demand.
# Needs: repository variables STAGING_SUPABASE_URL and
# STAGING_SUPABASE_PUBLISHABLE_KEY (both public by design) and the secret
# STAGING_TEST_PASSWORD (the fake people's shared password).

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/shared/**"
      - ".github/workflows/phone-journeys.yml"
      - "e2e/staging-journeys/**"
      - "playwright.staging-journeys.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-journeys-staging # one at a time: the flows change staging's fake data
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_IRIS_ENVIRONMENT: staging
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      # Fern (docs/PERSONAS.md): her journeys write this run's id into their notes.
      MAESTRO_FERN_EMAIL: fern.flute@example.com
      MAESTRO_VIOLET_EMAIL: violet.viola@example.com
      MAESTRO_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      - name: Build the app (release build, this commit's code, no over-the-air updates)
        run: |
          npx expo prebuild --platform android --no-install
          # Test this commit's code, not the latest published update.
          sed -i 's#android:name="expo.modules.updates.ENABLED" android:value="true"#android:name="expo.modules.updates.ENABLED" android:value="false"#' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease --no-daemon -q
          ls -la app/build/outputs/apk/release/

      - name: Get staging ready (fake data)
        run: |
          node .maestro/prepare-staging.mjs | tee -a "$GITHUB_ENV"
          # Dex: a documented date to change on the phone, then check on the website.
          PHONE_TIME_ZONE=America/Phoenix node .maestro/prepare-dex.mjs | tee -a "$GITHUB_ENV"
          # Gus: three draft dates he plays in a month open for the team.
          node .maestro/prepare-gus.mjs | tee -a "$GITHUB_ENV"
          echo "MAESTRO_PASSWORD=$STAGING_TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use hardware acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the phone journeys on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: mobile
          # Arizona time, like Fern's building (Splendido): "Today" on the phone comes from its clock.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone America/Phoenix
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/musician-tour.yaml --format junit --output maestro-tour.xml --test-output-dir maestro-output
            maestro test .maestro/cant-play.yaml --format junit --output maestro-cant-play.xml --test-output-dir maestro-output
            # Fern (docs/PERSONAS.md): no screen lock first (nothing kept), then a PIN and the basement with no signal.
            maestro test .maestro/fern-no-lock.yaml --format junit --output maestro-fern-no-lock.xml --test-output-dir maestro-output
            adb shell locksettings set-pin 1111
            adb shell svc power stayon true
            maestro test .maestro/fern-offline.yaml --format junit --output maestro-fern-offline.xml --test-output-dir maestro-output
            node .maestro/check-offline-sent.mjs
            # Dex (docs/PERSONAS.md), phone half; the website half is the next step.
            maestro test .maestro/dex-phone.yaml --format junit --output maestro-dex-phone.xml --test-output-dir maestro-output
            # Violet (docs/PERSONAS.md): logs with no signal, then the phone's clock jumps 15 days (O8: 14), then back with signal.
            maestro test .maestro/violet-away-1.yaml --format junit --output maestro-violet-1.xml --test-output-dir maestro-output
            adb root && adb wait-for-device
            adb shell settings put global auto_time 0
            adb shell date "$(TZ=America/Phoenix date -d '+15 days' +%m%d%H%M%Y.%S)"
            maestro test .maestro/violet-away-2.yaml --format junit --output maestro-violet-2.xml --test-output-dir maestro-output
            adb shell date "$(TZ=America/Phoenix date +%m%d%H%M%Y.%S)"
            adb shell settings put global auto_time 1
            maestro test .maestro/violet-away-3.yaml --format junit --output maestro-violet-3.xml --test-output-dir maestro-output
            node .maestro/check-offline-sent.mjs --email "$MAESTRO_VIOLET_EMAIL" --expect away=1
            # Gus (docs/PERSONAS.md): double taps, the season count, a leader swap. Cleanup runs even if the journey fails.
            maestro test .maestro/gus-edges.yaml --format junit --output maestro-gus.xml --test-output-dir maestro-output || { node .maestro/prepare-gus.mjs --cleanup; exit 1; }
            node .maestro/prepare-gus.mjs --cleanup
            mkdir -p shots/normal-text && mv *.png shots/normal-text/
            # Vera (docs/PERSONAS.md): the same tour with the phone's text at its largest.
            adb shell settings put system font_scale 2.0
            maestro test .maestro/musician-tour.yaml --format junit --output maestro-tour-large-text.xml --test-output-dir maestro-output/large-text
            mkdir -p shots/large-text && mv *.png shots/large-text/

      # Dex, website half: the number from the phone shows on the staging
      # website, which then puts the original back. Runs even if a phone
      # journey failed, so staging is never left with the test's number.
      - name: Dex on the website (staging)
        if: always() && env.MAESTRO_DEX_DAY != ''
        working-directory: .
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.staging-journeys.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-journeys
          path: |
            mobile/maestro-*.xml
            mobile/maestro-output/
            mobile/shots/
            mobile/*.png
          retention-days: 14
