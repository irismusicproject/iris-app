# Fern (docs/PERSONAS.md), part 2: phone only, no signal in the basement
# (docs/ACCEPTANCE.md O1, O2, O4). She logs relationship building with no
# signal; the phone keeps it and says so; when signal returns it sends by
# itself, once. check-offline-sent.mjs then confirms staging has exactly one.
#
# Needs: MAESTRO_FERN_EMAIL, MAESTRO_PASSWORD, MAESTRO_RUN.
# The emulator must HAVE a screen lock (the workflow sets a PIN first), and
# its time zone should be the building's (Splendido: America/Phoenix), since
# "Today" comes from the phone's clock.
appId: org.irismusicproject.iris
name: "Fern, offline - saved on the phone, sent once when signal returns"
tags:
  - offline
---
- launchApp:
    clearState: true
# Past the splash screen first (a slow start lost the first tap, Nov 25).
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 30000
- tapOn:
    id: "sign-in-email"
- inputText: ${MAESTRO_FERN_EMAIL}
# The form slides up as the keyboard opens; tapping during the slide hit
# "Email me a code instead" on iOS (Nov 25).
- waitForAnimationToEnd
- tapOn:
    id: "sign-in-password"
- inputText: ${MAESTRO_PASSWORD}
# Android only: on iOS hideKeyboard taps the screen and can hit a link
# ("Reset it on the website"); there Log in stays above the keyboard.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Log in"
# iOS asks "Save Password?" over the app after signing in.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
- extendedWaitUntil:
    visible: "My week →"
    timeout: 30000
- tapOn: "My week →"
# My week is loaded when its "Due ..." label shows (the Log button is further down).
- extendedWaitUntil:
    visible: "Due .*"
    timeout: 30000

# The basement: no signal.
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible: "You're offline\\. Your work is saved on this phone.*"
    timeout: 20000

- scrollUntilVisible:
    element: "Log an activity"
    centerElement: true
    timeout: 60000
- tapOn: "Log an activity"
- tapOn: ".*Splendido.*"
- scrollUntilVisible:
    element: "30 min"
    centerElement: true
    timeout: 60000
- tapOn: "30 min"
- scrollUntilVisible:
    element:
      id: "log-new-residents"
    centerElement: true
    timeout: 60000
- tapOn:
    id: "log-new-residents"
- inputText: "Phone Test T."
- scrollUntilVisible:
    element:
      id: "log-note"
    centerElement: true
    timeout: 60000
- tapOn:
    id: "log-note"
- inputText: "[phone test ${MAESTRO_RUN}] offline"
- hideKeyboard
- scrollUntilVisible:
    element: "Log activity"
    centerElement: true
    timeout: 60000
- tapOn: "Log activity"
# O1: kept on the phone, and it says so in plain words.
- extendedWaitUntil:
    visible: "Saved on this phone\\. It sends by itself when you're back online\\."
    timeout: 20000
- scrollUntilVisible:
    element: "Saved on this phone: .*Phone Test T\\..*"
    centerElement: true
    timeout: 60000
- takeScreenshot: fern-offline-0-saved-on-phone

# My week lists it under "Not sent yet".
- back
- scrollUntilVisible:
    element: "Not sent yet"
    direction: UP
    centerElement: true
    timeout: 60000
- assertVisible: "Saved on this phone"
- takeScreenshot: fern-offline-1-not-sent-yet

# Back in the parking lot: signal returns, and it sends by itself.
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "Not sent yet"
    timeout: 90000
- scrollUntilVisible:
    element: "All caught up\\. 1 item sent\\."
    direction: UP
    centerElement: true
    timeout: 60000
- takeScreenshot: fern-offline-2-caught-up
