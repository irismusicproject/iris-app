# The phone side of docs/ACCEPTANCE.md C1, C3 and C7: a musician marks
# "I can't play" on a date in an open month, sees it on their calendar, and
# undoes it. The website side is e2e/month-cycle.spec.ts.
#
# Runs against STAGING (fake data) with the fake musician. Needs:
#   MAESTRO_EMAIL, MAESTRO_PASSWORD           the fake musician's sign-in
#   MAESTRO_DATE_TITLE, MAESTRO_MONTHS_AHEAD  from prepare-staging.mjs
# Screenshots (cant-play-*.png) let a person check the colors: Maestro
# can't read colors, and the orange is exactly what this journey is about.
appId: org.irismusicproject.iris
name: "I can't play - mark, see it on the calendar, undo"
tags:
  - month-cycle
---
- launchApp:
    clearState: true
# Past the splash screen first (a slow start lost the first tap, Nov 25).
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 30000
- tapOn:
    id: "sign-in-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: "Log in"
- takeScreenshot: cant-play-0-after-sign-in
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 30000
- tapOn: "Calendar"
- repeat:
    times: ${MAESTRO_MONTHS_AHEAD}
    commands:
      - tapOn: "Next →"
- scrollUntilVisible:
    element: "${MAESTRO_DATE_DAY}.*"
    centerElement: true
    timeout: 60000
- tapOn: "${MAESTRO_DATE_DAY}.*"
# Below the fold on a small phone: scroll to it first.
- scrollUntilVisible:
    element: "I can't play this date"
    centerElement: true
    timeout: 60000
- tapOn: "I can't play this date"
- assertVisible: "Marked\\..*can't play this season\\."
- takeScreenshot: cant-play-1-date-marked
- back
- takeScreenshot: cant-play-2-calendar-shows-it
- assertVisible: ".*Orange: you can.t play.*"
# Undo, so staging is left as it was.
- tapOn: "${MAESTRO_DATE_DAY}.*"
- scrollUntilVisible:
    element: "Marked: I can't play \\(tap to undo\\)"
    centerElement: true
    timeout: 60000
- tapOn: "Marked: I can't play \\(tap to undo\\)"
- assertVisible: "Undone: you're playing it again."
- takeScreenshot: cant-play-3-undone
